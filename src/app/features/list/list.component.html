<div class="container mx-auto p-4">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center h-64">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-blue-500"></div>
    <span class="ml-4 text-gray-600">Loading {{ type }}s...</span>
  </div>

  <!-- Error State -->
  <div *ngIf="!isLoading && error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
    <strong class="font-bold">Error: </strong>
    <span class="block sm:inline">{{ error }}</span>
  </div>

  <!-- No Items State -->
  <div *ngIf="!isLoading && !error && (!items || items.length === 0)" class="text-center py-8">
    <p class="text-gray-600 text-xl">No {{ type }}s found.</p>
    <p class="text-gray-500 mt-2">Try adjusting your filter or check back later.</p>
  </div>

  <!-- Main Content -->
  <div *ngIf="!isLoading && !error && items && items.length > 0" class="bg-white shadow-md rounded-lg overflow-hidden">
    <!-- Filter Input -->
    <div class="p-4 bg-gray-100">
      <input 
        type="text" 
        [(ngModel)]="filterText"
        (ngModelChange)="applyFilter(filterText)"
        placeholder="Filter {{ type }}s..."
        class="w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full">
        <!-- Table Header -->
        <thead class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
          <tr>
            <th *ngFor="let column of displayedColumns" class="py-3 px-6 text-left">
              {{ column | titlecase }}
            </th>
            <th class="py-3 px-6 text-right">Actions</th>
          </tr>
        </thead>

        <!-- Table Body -->
        <tbody class="text-gray-600 text-sm font-light">
          <tr 
            *ngFor="let item of getPaginatedItems()" 
            class="border-b border-gray-200 hover:bg-gray-100 cursor-pointer"
            (click)="onRowClick(item)"
          >
            <td *ngFor="let column of displayedColumns" class="py-3 px-6">
              {{ item[column] }}
            </td>
            <td class="py-3 px-6 text-right">
              <button class="text-blue-500 hover:text-blue-700">
                View Details
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div *ngIf="getTotalPages() > 1" class="flex justify-between items-center p-4 bg-gray-100">
      <button 
        (click)="prevPage()" 
        [disabled]="currentPage === 1"
        class="px-4 py-2 bg-blue-500 text-white rounded disabled:opacity-50"
      >
        Previous
      </button>
      <span class="text-gray-600">
        Page {{ currentPage }} of {{ getTotalPages() }}
      </span>
      <button 
        (click)="nextPage()" 
        [disabled]="currentPage === getTotalPages()"
        class="px-4 py-2 bg-blue-500 text-white rounded disabled:opacity-50"
      >
        Next
      </button>
    </div>
  </div>
</div>
